<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #272727;
    --text: #e8e8e8;
    --muted: #666;
    --accent: #c8f060;
    --accent-dim: rgba(200, 240, 96, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 56px 40px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .site-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    line-height: 1;
    letter-spacing: -1px;
    color: #fff;
  }

  .site-title span {
    color: var(--accent);
  }

  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.8;
  }

  /* ── Controls ── */
  .controls {
    padding: 20px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(8px);
    z-index: 10;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    max-width: 320px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    padding: 9px 14px 9px 36px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--accent);
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.85rem;
  }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.78rem;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    border-color: #444;
    color: var(--text);
  }

  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-left: auto;
  }

  /* ── Song List ── */
  main {
    padding: 0 40px 80px;
  }

  .song-list {
    list-style: none;
  }

  .song-item {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: default;
  }

  .song-item:hover {
    background: var(--surface);
    margin: 0 -16px;
    padding: 16px 16px;
    border-radius: 6px;
  }

  .song-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
  }

  .song-info {}

  .song-name {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 3px;
  }

  .song-artist {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .song-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }

  .song-tag {
    font-size: 0.68rem;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 7px;
    color: var(--muted);
    white-space: nowrap;
  }

  .song-duration {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  /* ── States ── */
  .state-box {
    padding: 80px 40px;
    text-align: center;
    color: var(--muted);
  }

  .state-box .icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
    display: block;
  }

  .state-box p {
    font-size: 0.85rem;
    line-height: 1.7;
  }

  .retry-btn {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.82rem;
    padding: 8px 20px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .retry-btn:hover { border-color: #444; }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: #333;
  }

  @media (max-width: 600px) {
    header, .controls, main, footer { padding-left: 20px; padding-right: 20px; }
    .song-item { grid-template-columns: 28px 1fr auto; gap: 10px; }
    .meta { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="site-title">SETLIST<span>.</span></div>
  <div class="meta">
    <div id="last-updated">載入中...</div>
    <div>Powered by Google Sheets</div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="搜尋歌名、演出者...">
  </div>
  <div class="filter-group" id="filters">
    <button class="filter-btn active" data-cat="all">全部</button>
  </div>
  <div class="count" id="count">— 首</div>
</div>

<main>
  <ul class="song-list" id="song-list"></ul>
  <div class="state-box" id="state-box" style="display:none"></div>
</main>

<footer>SETLIST — 資料來源：Google Sheets</footer>

<script>
  // 你的 Google Sheets 發布網址（已設定好）
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTh7Ux4nLUBNn021h_pxndR5tSFLnTJ9pVGYjs7yR4LbOiOuABpcohdD1CCFa-zLaWzbeJ1G6as5IGw/pub?gid=0&single=true&output=csv";

  let allSongs = [];
  let activeCategory = "all";

  async function loadSongs() {
    showState("⏳", "載入歌單中...", false);
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error("fetch failed");
      const text = await res.text();

      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error("empty");
      const headers = rows[0];
      allSongs = rows.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = (row[i] || "").trim(); });
        // 欄位對應（你的試算表欄位名稱）
        return {
          歌名: obj["歌曲名稱"] || obj["歌名"] || "",
          演出者: obj["歌手"] || obj["演出者"] || "",
          分類: obj["語種"] || obj["分類"] || "",
          時長: obj["時長"] || "",
          備註: obj["備註"] || "",
        };
      }).filter(s => s["歌名"]);

      document.getElementById("last-updated").textContent = `更新：${new Date().toLocaleDateString("zh-TW")}`;
      buildFilters();
      render();
    } catch (e) {
      showState("⚠️",
        `無法載入歌單<br><small style="font-size:0.8em">請確認試算表已「發布到網路」<br>（檔案 → 共用 → 發布到網路 → CSV → 發布）</small>`,
        true
      );
    }
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') inQ = false;
        else field += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== '\r') field += c;
      }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function buildFilters() {
    const cats = [...new Set(allSongs.map(s => s["分類"]).filter(Boolean))];
    const group = document.getElementById("filters");
    group.innerHTML = `<button class="filter-btn active" data-cat="all">全部</button>`;
    cats.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn";
      btn.dataset.cat = cat;
      btn.textContent = cat;
      group.appendChild(btn);
    });
    group.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        group.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });
  }

  function render() {
    const query = document.getElementById("search").value.toLowerCase();
    let songs = allSongs;

    if (activeCategory !== "all") {
      songs = songs.filter(s => s["分類"] === activeCategory);
    }
    if (query) {
      songs = songs.filter(s =>
        (s["歌名"] || "").toLowerCase().includes(query) ||
        (s["演出者"] || "").toLowerCase().includes(query)
      );
    }

    document.getElementById("count").textContent = `${songs.length} 首`;

    if (songs.length === 0) {
      showState("😕", "找不到符合的歌曲", false);
      return;
    }

    hideState();
    const list = document.getElementById("song-list");
    list.innerHTML = songs.map((s, i) => `
      <li class="song-item">
        <span class="song-num">${String(i + 1).padStart(2, "0")}</span>
        <div class="song-info">
          <div class="song-name">${s["歌名"] || ""}</div>
          <div class="song-artist">${s["演出者"] || ""}</div>
        </div>
        <div class="song-right">
          ${s["分類"] ? `<span class="song-tag">${s["分類"]}</span>` : ""}
          ${s["時長"] ? `<span class="song-duration">${s["時長"]}</span>` : ""}
        </div>
      </li>
    `).join("");
  }

  function showState(icon, msg, showRetry) {
    document.getElementById("song-list").innerHTML = "";
    const box = document.getElementById("state-box");
    box.style.display = "block";
    box.innerHTML = `
      <span class="icon">${icon}</span>
      <p>${msg}</p>
      ${showRetry ? `<button class="retry-btn" onclick="loadSongs()">重試</button>` : ""}
    `;
  }

  function hideState() {
    document.getElementById("state-box").style.display = "none";
  }

  document.getElementById("search").addEventListener("input", render);

  loadSongs();
</script>
</body>
</html>
