<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌單</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑🏾‍🦱</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑🏾‍🦱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #272727;
    --text: #e8e8e8;
    --muted: #666;
    --muted2: #999;
    --accent: #c8f060;
    --accent-dim: rgba(200, 240, 96, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    padding: 56px 40px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .site-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    line-height: 1;
    letter-spacing: -1px;
    color: #fff;
  }

  .site-title span { color: var(--accent); }

  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.8;
  }

  .search-row {
    padding: 18px 40px;
    display: flex;
    gap: 14px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,13,0.96);
    backdrop-filter: blur(10px);
    z-index: 10;
    flex-wrap: wrap;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    max-width: 360px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 9px 14px 9px 36px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.85rem;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted2);
    font-family: inherit;
    font-size: 0.78rem;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .clear-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .clear-btn:disabled { opacity: 0.3; cursor: default; }

  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-left: auto;
  }

  .filters {
    padding: 20px 40px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 16px;
    align-items: start;
  }

  .filter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-top: 6px;
  }

  .filter-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--muted2);
    font-family: inherit;
    font-size: 0.78rem;
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .filter-btn:hover { border-color: #444; color: var(--text); }
  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  main { padding: 8px 40px 80px; }
  .song-list { list-style: none; }

  .song-item {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .song-item:hover {
    background: var(--surface);
    margin: 0 -16px;
    padding: 14px 16px;
    border-radius: 6px;
  }

  .song-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
  }

  .song-name {
    font-size: 0.95rem;
    color: var(--text);
    margin-bottom: 3px;
  }

  .song-artist {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .song-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 320px;
  }

  .song-tag {
    font-size: 0.66rem;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    color: var(--muted2);
    white-space: nowrap;
  }

  .state-box {
    padding: 80px 40px;
    text-align: center;
    color: var(--muted);
  }
  .state-box .icon { font-size: 2.5rem; margin-bottom: 16px; display: block; }
  .state-box p { font-size: 0.85rem; line-height: 1.7; }

  .retry-btn {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 8px 20px;
    cursor: pointer;
  }
  .retry-btn:hover { border-color: var(--accent); }

  footer {
    border-top: 1px solid var(--border);
    padding: 20px 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: #333;
  }

  @media (max-width: 600px) {
    header, .search-row, .filters, main, footer { padding-left: 20px; padding-right: 20px; }
    .filter-row { grid-template-columns: 1fr; gap: 6px; }
    .song-item { grid-template-columns: 28px 1fr; gap: 10px; }
    .song-tags { display: none; }
    .meta { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="site-title">SETLIST<span>.</span></div>
  <div class="meta">
    <div id="last-updated">載入中...</div>
    <div>Powered by Google Sheets</div>
  </div>
</header>

<div class="search-row">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="搜尋歌名、演出者...">
  </div>
  <button class="clear-btn" id="clear-btn" disabled>清除篩選</button>
  <div class="count" id="count">— 首</div>
</div>

<div class="filters" id="filters"></div>

<main>
  <ul class="song-list" id="song-list"></ul>
  <div class="state-box" id="state-box" style="display:none"></div>
</main>

<footer>SETLIST — 資料來源：Google Sheets</footer>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTh7Ux4nLUBNn021h_pxndR5tSFLnTJ9pVGYjs7yR4LbOiOuABpcohdD1CCFa-zLaWzbeJ1G6as5IGw/pub?gid=0&single=true&output=csv";

  let allSongs = [];
  let tagGroups = {};
  let activeTags = new Set();

  async function loadSongs() {
    showState("⏳", "載入歌單中...", false);
    try {
      const res = await fetch(CSV_URL + "&t=" + Date.now());
      if (!res.ok) throw new Error("fetch failed");
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error("empty");

      const headers = rows[0].map(h => h.trim());
      const songs = [];
      const lookup = {};

      rows.slice(1).forEach(row => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (row[i] || "").trim(); });

        const songName = obj["歌曲名稱"] || obj["歌名"] || "";
        if (songName) {
          const tagStr = obj["標籤"] || "";
          const tags = tagStr.split(/[,，、]/).map(t => t.trim()).filter(Boolean);
          const lang = obj["語種"] || "";
          const artist = obj["歌手"] || obj["演出者"] || "";
          if (lang && !tags.includes(lang)) tags.push(lang);
          if (artist && !tags.includes(artist)) tags.push(artist);

          songs.push({ name: songName, artist: artist, tags: tags });
        }

        const tagItem = obj["分類項目"] || "";
        const tagGroup = obj["分類群組"] || "";
        if (tagItem && tagGroup) {
          lookup[tagItem] = tagGroup;
        }
      });

      allSongs = songs;

      tagGroups = {};
      Object.entries(lookup).forEach(([tag, group]) => {
        if (!tagGroups[group]) tagGroups[group] = [];
        tagGroups[group].push(tag);
      });

      document.getElementById("last-updated").textContent =
        `更新：${new Date().toLocaleDateString("zh-TW")}`;

      buildFilters();
      render();
    } catch (e) {
      showState("⚠️",
        `無法載入歌單<br><small style="font-size:0.8em">請確認試算表已「發布到網路」</small>`,
        true);
    }
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') inQ = false;
        else field += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== '\r') field += c;
      }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function buildFilters() {
    const container = document.getElementById("filters");
    container.innerHTML = "";

    const order = ["分類", "風格", "語言", "歌手", "其他"];
    const allGroups = Object.keys(tagGroups);
    const orderedGroups = [
      ...order.filter(g => allGroups.includes(g)),
      ...allGroups.filter(g => !order.includes(g))
    ];

    if (orderedGroups.length === 0) {
      container.style.display = "none";
      return;
    }

    orderedGroups.forEach(group => {
      const row = document.createElement("div");
      row.className = "filter-row";

      const label = document.createElement("div");
      label.className = "filter-label";
      label.textContent = group;

      const tagBox = document.createElement("div");
      tagBox.className = "filter-tags";
      tagGroups[group].forEach(tag => {
        const btn = document.createElement("button");
        btn.className = "filter-btn";
        btn.textContent = tag;
        btn.dataset.tag = tag;
        btn.addEventListener("click", () => toggleTag(tag));
        tagBox.appendChild(btn);
      });

      row.appendChild(label);
      row.appendChild(tagBox);
      container.appendChild(row);
    });
  }

  function toggleTag(tag) {
    if (activeTags.has(tag)) activeTags.delete(tag);
    else activeTags.add(tag);
    updateFilterUI();
    render();
  }

  function updateFilterUI() {
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.toggle("active", activeTags.has(btn.dataset.tag));
    });
    document.getElementById("clear-btn").disabled = activeTags.size === 0;
  }

  function render() {
    const query = document.getElementById("search").value.toLowerCase().trim();
    let songs = allSongs;

    if (activeTags.size > 0) {
      songs = songs.filter(s =>
        [...activeTags].every(t => s.tags.includes(t))
      );
    }
    if (query) {
      songs = songs.filter(s =>
        s.name.toLowerCase().includes(query) ||
        s.artist.toLowerCase().includes(query)
      );
    }

    document.getElementById("count").textContent = `${songs.length} 首`;

    if (songs.length === 0) {
      showState("😕", "找不到符合的歌曲", false);
      return;
    }

    hideState();
    const list = document.getElementById("song-list");
    list.innerHTML = songs.map((s, i) => `
      <li class="song-item">
        <span class="song-num">${String(i + 1).padStart(2, "0")}</span>
        <div>
          <div class="song-name">${escapeHTML(s.name)}</div>
          <div class="song-artist">${escapeHTML(s.artist)}</div>
        </div>
        <div class="song-tags">
          ${s.tags.slice(0, 4).map(t => `<span class="song-tag">${escapeHTML(t)}</span>`).join("")}
        </div>
      </li>
    `).join("");
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function showState(icon, msg, showRetry) {
    document.getElementById("song-list").innerHTML = "";
    const box = document.getElementById("state-box");
    box.style.display = "block";
    box.innerHTML = `
      <span class="icon">${icon}</span>
      <p>${msg}</p>
      ${showRetry ? `<button class="retry-btn" onclick="loadSongs()">重試</button>` : ""}
    `;
  }

  function hideState() {
    document.getElementById("state-box").style.display = "none";
  }

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("clear-btn").addEventListener("click", () => {
    activeTags.clear();
    updateFilterUI();
    render();
  });

  loadSongs();
</script>
</body>
</html>
